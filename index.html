        }

        /* Estilos base del body */
        body {

        /* Estilos de las tarjetas (Card) */
        .card {

            border-radius: 1rem; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); 
        }

        /* Estilos base de los botones (Button) */
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 0.75rem; 
            font-weight: 500; 
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity; 
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); 
            transition-duration: 150ms; 
            font-size: 0.875rem; 
            line-height: 1.25rem; 
            padding-left: 1rem; 
            padding-right: 1rem; 
            padding-top: 0.5rem; 
            padding-bottom: 0.5rem; 
            cursor: pointer;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Variantes de botones */
        .btn-primary { 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        
        .btn-primary:hover:not(:disabled) { 
            background-color: #1e293b; 
        }
        
        .btn-outline { 
            border: 1px solid #e2e8f0; 
            background-color: transparent; 
        }
        
        .btn-outline:hover:not(:disabled) { 
            background-color: #f1f5f9; 
            color: #0f172a; 
        }

        /* Estilos de los inputs (Input y Select) */
        .input { 
            display: flex; 
            height: 2.5rem; 
            width: 100%; 
            border-radius: 0.75rem; 
            border: 1px solid #e2e8f0; 
            background-color: white; 
            padding-left: 0.75rem; 
            padding-right: 0.75rem; 
            padding-top: 0.5rem; 
            padding-bottom: 0.5rem; 
            font-size: 0.875rem; 
            line-height: 1.25rem; 
        }
        
        .input:focus { 
            outline: 2px solid transparent; 
            outline-offset: 2px; 
            box-shadow: 0 0 0 2px #0f172a; 
        }
        
        .input:disabled {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

            padding-bottom: 0.125rem;

        }

// 2. FUNCIONES DE AYUDA (Helpers)

const findVerb = (verbName) => {
    return verbs.find(v => v.base === verbName);
};

const getVerbInfo = (item) => {
    return item.custom || findVerb(item.verb) || { past: item.verb, pronunciation: "", sound: "" };
};

window.speak = (text) => {
    if (typeof window === "undefined" || !window.speechSynthesis) {
        alert("Tu navegador no soporta reproducción de voz.");
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
};

const randomItem = (arr) => {
    return arr[Math.floor(Math.random() * arr.length)];
};

const normalize = (s) => {
    return s.trim().toLowerCase().replace(/[.!?]/g, "");
};

// --- LÓGICA PARA LOS 50 JUEGOS CLÁSICOS (ORIGINALES) ---

window.initGames = () => {
    gameState.challenges = [];
    const gameTypes = ['fill', 'class', 'quiz'];
    
    for (let i = 0; i < 50; i++) {
        let type = gameTypes[i % 3]; 
        let challenge = {
            id: i,
            type: type,
            result: null
        };
        
        if (type === 'fill') {
            challenge.item = randomItem(practiceSentences);
            challenge.answer = '';
        } else if (type === 'class') {
            challenge.item = randomItem(verbs);
        } else if (type === 'quiz') {
            let v = randomItem(verbs);
            let wrongOptions = verbs
                .filter(x => x.past !== v.past)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(x => x.past);
            challenge.item = v;
            challenge.options = [...wrongOptions, v.past].sort(() => 0.5 - Math.random());
            challenge.choice = null;
        }
        
        gameState.challenges.push(challenge);
    }
    
    gameState.challenges.sort(() => 0.5 - Math.random());
    gameState.challenges.forEach((ch, index) => ch.id = index);
};

window.updateFill = (id, val) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (ch) ch.answer = val;
};

window.checkFill = (id) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    const info = getVerbInfo(ch.item);
    const correctPast = info.past || ch.item.custom?.past;
    
    if (normalize(ch.answer) === normalize(correctPast)) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

window.pickClass = (id, sound) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    if (sound === ch.item.sound) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

window.pickQuiz = (id, choice) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    ch.choice = choice;
    if (choice === ch.item.past) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

// --- LÓGICA PARA LOS 100 NUEVOS JUEGOS VARIADOS (PRO CHALLENGES) ---

window.initProGames = () => {
    proGameState.challenges = [];
    const types = ['sound_match', 'odd_one_out', 'reading', 'syllable', 'listen_guess'];
    const stories = [
        "Ayer yo {past} con mis amigos toda la tarde. Fue genial.",
        "Ella {past} muy temprano esta mañana antes de ir a trabajar.",
        "Nosotros no sabíamos qué hacer, así que él {past} ayudarnos un poco.",
        "El fin de semana pasado, mi familia {past} en el parque central.",
        "Cuando vi lo que pasó, me sorprendí y {past} inmediatamente."
    ];

    for(let i = 0; i < 100; i++) {
        // Aseguramos pasar por casi toda la lista de verbos
        let verb = verbs[i % verbs.length]; 
        let type = types[i % types.length];
        
        let ch = {
            id: i,
            type: type,
            verb: verb,
            result: null,
            choice: null
        };

        if (type === 'sound_match') {
            // Verdadero / Falso sobre el sonido
            let isTrue = Math.random() > 0.5;
            let otherSounds = ['/t/', '/d/', '/id/', 'irregular'].filter(s => s !== verb.sound);
            ch.testSound = isTrue ? verb.sound : randomItem(otherSounds);
            ch.isTrue = isTrue;
            ch.correct = isTrue ? 'Verdadero' : 'Falso';
            ch.options = ['Verdadero', 'Falso'];
            
        } else if (type === 'odd_one_out') {
            // El Intruso: 2 verbos mismo sonido, 1 distinto
            let soundA = verb.sound;
            let otherSounds = ['/t/', '/d/', '/id/', 'irregular'].filter(s => s !== soundA);
            let soundB = randomItem(otherSounds);
            
            let poolA = verbs.filter(v => v.sound === soundA);
            let poolB = verbs.filter(v => v.sound === soundB);
            
            let v2 = randomItem(poolA);
            if (v2.base === verb.base && poolA.length > 1) {
                v2 = randomItem(poolA.filter(v => v.base !== verb.base));
            }
            let v3 = randomItem(poolB); // El intruso
            
            ch.options = [verb.base, v2.base, v3.base].sort(() => 0.5 - Math.random());
            ch.correct = v3.base;
            
        } else if (type === 'reading') {
            // Lectura corta con verbo en pasado
            ch.text = randomItem(stories).replace('{past}', `<b>${verb.past}</b>`);
            ch.options = ['/t/', '/d/', '/id/', 'irregular'];
            ch.correct = verb.sound;
            
        } else if (type === 'syllable') {
            // ¿Sílaba extra al final? (Solo ocurre con sonido /id/)
            ch.correct = verb.sound === '/id/' ? 'Sí' : 'No';
            ch.options = ['Sí', 'No'];
            
        } else if (type === 'listen_guess') {
            // Escuchar y adivinar base verb
            let wrongOptions = verbs
                .filter(v => v.base !== verb.base)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(v => v.base);
            ch.options = [...wrongOptions, verb.base].sort(() => 0.5 - Math.random());
            ch.correct = verb.base;
        }

        proGameState.challenges.push(ch);
    }
    
    // Mezclamos aleatoriamente los 100 juegos
    proGameState.challenges.sort(() => 0.5 - Math.random());
    proGameState.challenges.forEach((c, idx) => c.id = idx);
};

window.pickProGame = (id, choice) => {
    let ch = proGameState.challenges.find(c => c.id === id);
    if (!ch) return;
    
    ch.choice = choice;
    if (choice === ch.correct) {
        ch.result = 'ok';
    } else {
        ch.result = 'bad';
    }
    renderApp();
};

    return `

            ${tabsHTML}
        </div>
    `;

    }

    return `
        <div class="animate-fade-in">
            <div class="mb-4 grid gap-3 md:grid-cols-[1fr_auto]">
                <input 
                    class="input" 
                    placeholder="Buscar verbo, español o pronunciación..." 
                    value="${learnQuery}" 
                    onkeyup="setLearnQuery(this.value)"

                <select class="input w-auto rounded-xl" onchange="setLearnFilter(this.value)">

                    <option value="/t/" ${learnFilter === '/t/' ? 'selected' : ''}>/t/</option>

}

function renderPronunciation() {
    const groups = [
        { 
            sound: "/t/", 
            title: "Sonido /t/", 
            rule: "Se usa cuando el verbo termina en sonido sordo: k, p, sh, ch, f, s, x.", 
            examples: verbs.filter(v => v.sound === "/t/") 
        },
        { 
            sound: "/d/", 
            title: "Sonido /d/", 
            rule: "Se usa cuando el verbo termina en sonido sonoro: vocal, l, n, r, v, z, m, g, y.", 
            examples: verbs.filter(v => v.sound === "/d/") 
        },
        { 
            sound: "/id/", 
            title: "Sonido /id/", 
            rule: "Se usa cuando el verbo termina en sonido /t/ o /d/.", 
            examples: verbs.filter(v => v.sound === "/id/") 
        },
        { 
            sound: "irregular", 
            title: "Irregulares", 
            rule: "No siguen la regla -ed. Hay que aprender pasado y participio por memoria y uso.", 
            examples: verbs.filter(v => v.type === "irregular") 
        }
    ];

    let groupsHTML = '';
    for (let g of groups) {
        let examplesHTML = '';
        for (let v of g.examples) {
            let safeText = v.past.replace(/'/g, "\\'");
            examplesHTML += `
                <button class="btn btn-outline rounded-full text-xs py-1" onclick="speak('${safeText}')">
                    ${v.past} <i data-lucide="volume-2" class="ml-2 h-3 w-3"></i>
                </button>
            `;
        }
        
        groupsHTML += `
            <div class="card p-4 animate-fade-in">
                <h2 class="text-xl font-bold">${g.title}</h2>
                <p class="mt-1 text-sm text-slate-600">${g.rule}</p>
                <div class="mt-3 flex flex-wrap gap-2">
                    ${examplesHTML}
                </div>
            </div>
        `;
    }

    return `
        <div class="grid gap-4 animate-fade-in">
            ${groupsHTML}
        </div>
    `;
}

function renderBuilder() {
    const s = builderState;
    const v = findVerb(s.verbName) || verbs[0];
    
    let sentence = "";
    let explanation = "";
    
    if (s.mode === "affirmative") {
        sentence = `${s.subject} ${v.past} ${s.complement}.`;
        explanation = `Afirmativa en pasado: Subject + verb in past + complement. Usamos "${v.past}" porque la acción ya ocurrió.`;
    } else if (s.mode === "negative") {
        sentence = `${s.subject} did not ${v.base} ${s.complement}.`;
        explanation = `Negativa en pasado: Subject + did not + verb in base form + complement. Después de did not, no se usa el pasado: no es "did not ${v.past}", es "did not ${v.base}".`;
    } else {
        sentence = `Did ${s.subject} ${v.base} ${s.complement}?`;
        explanation = `Pregunta en pasado: Did + subject + verb in base form + complement? Después de Did, el verbo vuelve a base: "${v.base}".`;
    }

    let optionsHTML = '';
    for (let verb of verbs) {
        let isSelected = s.verbName === verb.base ? 'selected' : '';
        optionsHTML += `
            <option value="${verb.base}" ${isSelected}>
                ${verb.base} → ${verb.past}
            </option>
        `;
    }

    let safeSentenceText = sentence.replace(/'/g, "\\'");

    return `
        <div class="card p-5 animate-fade-in">
            <h2 class="mb-3 flex items-center text-xl font-bold">
                <i data-lucide="pencil-line" class="mr-2 h-5 w-5"></i> Create sentences
            </h2>
            <div class="grid gap-3 md:grid-cols-4">
                <input 
                    class="input" 
                    value="${s.subject}" 
                    onkeyup="updateBuilder('subject', this.value)" 
                    placeholder="Subject" 
                />
                <select class="input" onchange="updateBuilder('verbName', this.value)">
                    ${optionsHTML}
                </select>
                <input 
                    class="input" 
                    value="${s.complement}" 
                    onkeyup="updateBuilder('complement', this.value)" 
                    placeholder="Complement" 
                />
                <select class="input" onchange="updateBuilder('mode', this.value)">
                    <option value="affirmative" ${s.mode === 'affirmative' ? 'selected' : ''}>Affirmative</option>
                    <option value="negative" ${s.mode === 'negative' ? 'selected' : ''}>Negative</option>
                    <option value="question" ${s.mode === 'question' ? 'selected' : ''}>Question</option>
                </select>
            </div>
            
            <div class="mt-5 rounded-2xl bg-slate-100 p-4 text-2xl font-bold">
                ${sentence}
            </div>
            
            <div class="mt-3 rounded-2xl border p-4 text-sm text-slate-700">
                <b>Explanation:</b> ${explanation}<br/>
                <b>Verb:</b> ${v.base} → ${v.past}. <b>Pronunciation:</b> ${v.pronunciation}. <b>Sound:</b> ${v.sound}.
            </div>
            
            <button class="btn btn-outline mt-4 rounded-xl" onclick="speak('${safeSentenceText}')">
                <i data-lucide="volume-2" class="mr-2 h-4 w-4"></i> Listen sentence
            </button>
        </div>
    `;
}

function renderGrammar() {
    return `
        <div class="grid gap-4 animate-fade-in">
            <div class="card p-5">
                <h2 class="flex items-center text-xl font-bold">
                    <i data-lucide="book-open" class="mr-2 h-5 w-5"></i> How to write sentences in Simple Past
                </h2>
                <div class="mt-4 grid gap-3 md:grid-cols-3">
                    <div class="rounded-2xl bg-slate-100 p-4">
                        <b>Affirmative</b>
                        <p>Subject + verb in past + complement.</p>
                        <p class="mt-2 font-semibold">Manolo loved María.</p>
                    </div>
                    <div class="rounded-2xl bg-slate-100 p-4">
                        <b>Negative</b>
                        <p>Subject + did not + base verb + complement.</p>
                        <p class="mt-2 font-semibold">Manolo did not kill the bull.</p>
                    </div>
                    <div class="rounded-2xl bg-slate-100 p-4">

                <p class="mt-2 text-sm text-slate-700">1. En afirmativa sí usamos el verbo en pasado: <b>Manolo saved the town.</b></p>
                <p class="text-sm text-slate-700">2. En negativa usamos <b>did not</b> y el verbo vuelve a base: <b>did not save</b>, no <b>did not saved</b>.</p>

function renderFillCard(ch) {
    const fInfo = getVerbInfo(ch.item);
    const correctPastTarget = fInfo.past || ch.item.custom?.past;
    const regex = new RegExp("\\b" + correctPastTarget + "\\b", "i");
    const fBlank = ch.item.past.replace(regex, "______");
    
    let statusHTML = '';
    let isOk = ch.result === 'ok';
    let isDisabled = isOk ? 'disabled' : '';
    
    if (ch.result) {
        let bgClass = isOk ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
        let iconName = isOk ? 'check-circle-2' : 'x-circle';
        let messageText = isOk ? "Correct!" : `Try again. Correct answer: ${fInfo.past}`;
        statusHTML = `
            <div class="mt-4 rounded-2xl p-4 ${bgClass} animate-fade-in">
                <i data-lucide="${iconName}" class="inline h-5 w-5"></i>
                ${messageText}<br/>
                Pronunciation: <b>${fInfo.pronunciation}</b> | Sound: <b>${fInfo.sound}</b><br/>

    const safeAudio = ch.item.past.replace(/'/g, "\\'");
    return `
        <div class="card p-5">

                <h2 class="flex items-center text-xl font-bold"><i data-lucide="gamepad-2" class="mr-2 h-5 w-5"></i> Complete the sentence</h2>

            <div class="mt-4 rounded-2xl bg-slate-100 p-4 text-xl font-bold">${fBlank}</div>

            <div class="mt-4 flex gap-2">
                <input class="input" value="${ch.answer}" onkeyup="updateFill(${ch.id}, this.value); if(event.key === 'Enter') checkFill(${ch.id});" placeholder="Past verb..." ${isDisabled} />

            ${statusHTML}
            <button class="btn btn-outline mt-4 rounded-xl w-full" onclick="speak('${safeAudio}')"><i data-lucide="volume-2" class="mr-2 h-4 w-4"></i> Listen answer</button>

    let activeContent = '';
    
    if (activeTab === 'learn') activeContent = renderLearn();
    else if (activeTab === 'pronunciation') activeContent = renderPronunciation();
    else if (activeTab === 'builder') activeContent = renderBuilder();
    else if (activeTab === 'grammar') activeContent = renderGrammar();
    else if (activeTab === 'sentences') activeContent = renderLibrary();
    else if (activeTab === 'movie') activeContent = renderMovieMode();
    else if (activeTab === 'games') activeContent = renderGames();
    else if (activeTab === 'pro-games') activeContent = renderProGames();

    appContainer.innerHTML = `
        <div class="min-h-screen bg-slate-50 p-4 text-slate-900 md:p-8 pb-20">
            <div class="mx-auto max-w-7xl">
                ${renderHeader()}
                ${renderTabs()}
                ${activeContent}
            </div>
        </div>
    `;

    lucide.createIcons();
}

window.onload = () => {
    renderApp();
};

</script>
</body>
</html>
