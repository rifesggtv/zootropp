// --- ESTADO GLOBAL ---
let currentView = 'menu';
let progress = { points: 0, learnedVerbs: [], quizzesPassed: 0 };

// --- UTILIDADES ---
window.playAudio = (text) => {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("Tu navegador no soporta reproducción de voz.");
  }
};

window.setView = (view) => {
  currentView = view;
  renderApp();
};

window.updateProgress = (newPoints) => {
  progress.points += newPoints;
  localStorage.setItem('verbMasterProgress', JSON.stringify(progress));
  document.getElementById('header-points').innerText = `${progress.points} pts`;
};

// Cargar progreso al iniciar

// Generador de Botones
const getButtonHTML = (text, onClick, variant = 'primary', icon = '', extraClass = '') => {
  const baseStyle = "px-4 py-2 rounded-lg font-semibold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer";
  const variants = {
    primary: "bg-indigo-600 text-white hover:bg-indigo-700 shadow-md",
    secondary: "bg-white text-indigo-600 border-2 border-indigo-200 hover:border-indigo-600",
    outline: "border-2 border-gray-300 text-gray-700 hover:bg-gray-50",
    danger: "bg-rose-500 text-white hover:bg-rose-600 shadow-md",
    success: "bg-emerald-500 text-white hover:bg-emerald-600 shadow-md",
  };
  return `<button onclick="${onClick}" class="${baseStyle} ${variants[variant]} ${extraClass}">${icon} ${text}</button>`;
};

// 1. APRENDER VERBOS (State)
window.learnState = { filter: 'all', search: '' };
window.updateLearnSearch = (val) => { window.learnState.search = val; renderApp(); };
window.updateLearnFilter = (val) => { window.learnState.filter = val; renderApp(); };

function renderLearn() {
  const s = window.learnState;
  const filteredVerbs = verbsData.filter(v => {
    const matchesSearch = v.present.includes(s.search.toLowerCase()) || v.spanish.includes(s.search.toLowerCase());
    if (!matchesSearch) return false;
    if (s.filter === 'regular') return v.type === 'regular';
    if (s.filter === 'irregular') return v.type === 'irregular';
    if (s.filter === 't') return v.sound === 't';
    if (s.filter === 'd') return v.sound === 'd';
    if (s.filter === 'id') return v.sound === 'id';
    return true;
  });

  const filters = [
    { id: 'all', label: 'Todos' }, { id: 'regular', label: 'Regulares' }, { id: 'irregular', label: 'Irregulares' },
    { id: 't', label: 'Sonido /t/' }, { id: 'd', label: 'Sonido /d/' }, { id: 'id', label: 'Sonido /id/' }
  ];

  let filterButtons = filters.map(f => `
    <button onclick="updateLearnFilter('${f.id}')" class="px-3 py-1 rounded-full text-sm font-medium transition-colors ${s.filter === f.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
      ${f.label}
    </button>
  `).join('');

  let tableRows = filteredVerbs.map(v => `
    <tr class="border-b hover:bg-slate-50 transition-colors">
      <td class="p-4 font-semibold text-indigo-700">${v.present}</td>
      <td class="p-4 font-medium">${v.past} ${v.type === 'regular' ? `<span class="block text-xs text-slate-400">Pron: ${v.pron}</span>` : ''}</td>
      <td class="p-4 text-slate-600">${v.spanish}</td>
      <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold ${v.type === 'regular' ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'}">${v.type}</span></td>
      <td class="p-4 font-mono text-slate-500">${v.sound ? `/${v.sound}/` : '-'}</td>
      <td class="p-4 text-center">
        <button onclick="playAudio('${v.past}')" class="text-indigo-500 hover:text-indigo-700 p-2 rounded-full hover:bg-indigo-50">
          <i data-lucide="volume-2" class="w-5 h-5"></i>
        </button>
      </td>
    </tr>
  `).join('');

  if (filteredVerbs.length === 0) tableRows = `<tr><td colSpan="6" class="p-8 text-center text-slate-500">No se encontraron verbos.</td></tr>`;

  return `
    <div class="space-y-6 animate-fade-in">
      <div class="flex items-center justify-between">
        ${getButtonHTML('Menú', "setView('menu')", 'outline', '<i data-lucide="arrow-left" class="w-4 h-4"></i>')}
        <h2 class="text-2xl font-bold">Diccionario de Verbos</h2>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
        <input type="text" placeholder="Buscar verbo..." class="w-full md:w-64 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" value="${s.search}" onkeyup="updateLearnSearch(this.value)">
        <div class="flex flex-wrap gap-2 justify-center">${filterButtons}</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-700">
              <th class="p-4 border-b">Presente</th><th class="p-4 border-b">Pasado</th><th class="p-4 border-b">Español</th>
              <th class="p-4 border-b">Tipo</th><th class="p-4 border-b">Sonido Final</th><th class="p-4 border-b text-center">Escuchar</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// 2. PRONUNCIACIÓN
function renderPronunciation() {
  const rules = [
    { sound: '/t/', desc: 'Si el verbo en su forma base termina en un sonido SORDO (p, k, f, s, sh, ch).', examples: ['watch → watched', 'work → worked', 'help → helped'], audioWord: 'watched', color: 'bg-rose-50 border-rose-200 text-rose-800' },
    { sound: '/d/', desc: 'Si el verbo en su forma base termina en un sonido SONORO (l, n, r, g, v, z, m) o una VOCAL.', examples: ['play → played', 'clean → cleaned', 'live → lived'], audioWord: 'played', color: 'bg-emerald-50 border-emerald-200 text-emerald-800' },
    { sound: '/id/', desc: 'Si el verbo en su forma base termina en el sonido /t/ o /d/. ¡Es la única vez que pronuncias una sílaba extra!', examples: ['want → wanted', 'need → needed', 'visit → visited'], audioWord: 'wanted', color: 'bg-blue-50 border-blue-200 text-blue-800' }
  ];

  let rulesHTML = rules.map(rule => `
    <div class="bg-white rounded-xl shadow-sm border-2 ${rule.color} p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-3xl font-black">${rule.sound}</h3>
        <button onclick="playAudio('${rule.audioWord}')" class="bg-white p-3 rounded-full shadow hover:scale-110 transition-transform">
          <i data-lucide="volume-2" class="w-6 h-6 text-indigo-600"></i>
        </button>
      </div>
      <p class="text-slate-700 mb-4 h-24">${rule.desc}</p>
      <div class="bg-white bg-opacity-60 rounded-lg p-3">
        <h4 class="font-bold text-sm text-slate-500 mb-2">Ejemplos:</h4>
        <ul class="space-y-2">
          ${rule.examples.map(ex => `
            <li class="flex justify-between items-center font-mono font-medium text-indigo-900">
              ${ex}
              <button onclick="playAudio('${ex.split('→')[1].trim()}')" class="text-indigo-400 hover:text-indigo-600"><i data-lucide="play-circle" class="w-4 h-4"></i></button>
            </li>
          `).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  return `
    <div class="space-y-6 animate-fade-in">
      <div class="flex items-center justify-between">
        ${getButtonHTML('Menú', "setView('menu')", 'outline', '<i data-lucide="arrow-left" class="w-4 h-4"></i>')}
        <h2 class="text-2xl font-bold">Reglas de Pronunciación (-ed)</h2>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm text-lg text-slate-700">
        <p>Los verbos regulares en pasado terminan en <strong>-ed</strong>, pero esta terminación tiene <strong>3 pronunciaciones diferentes</strong> dependiendo del sonido final del verbo original. ¡Nunca se pronuncia como se escribe en español!</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${rulesHTML}</div>
    </div>
  `;
}

window.updateSent = (key, val) => { window.sentState[key] = val; renderApp(); };

  const s = window.sentState;
  const subjects = ['Manolo', 'María', 'Joaquín', 'They', 'We', 'I'];

            <option value="">Selecciona...</option>
            ${complements.map(c => `<option value="${c}" ${s.complement === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>

      </div>
      ${sentence ? `
        <div class="bg-indigo-50 border border-indigo-200 mt-8 p-6 rounded-xl shadow-sm">

              ${s.mode === 'negative' ? `<li><strong>Auxiliar negativo:</strong> did not (didn't) + <strong>Verbo base:</strong> ${vObj.present}</li>` : ''}
              ${s.mode === 'question' ? `<li><strong>Auxiliar pregunta:</strong> Did + <strong>Verbo base:</strong> ${vObj.present}</li>` : ''}
              <li><strong>Complemento:</strong> ${s.complement}</li>

window.fbNext = () => {

};

function renderFillBlanks() {
  const s = window.fbState;

              <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i> ${isCorrect ? '¡Correcto!' : 'Incorrecto'}
            </div>
            <p class="text-slate-700">
              ${q.exp || (isCorrect ? `¡Muy bien! "${q.correct}" es la forma correcta.` : `La respuesta correcta era "${q.correct}".`)}

              ${vObj && vObj.type === 'irregular' ? ` Este es un verbo irregular (presente: ${vObj.present}).` : ''}
            </p>

window.memState = { cards: [], flipped: [], matched: [] };
window.initMemory = () => {
  const selected = [...verbsData].sort(() => 0.5 - Math.random()).slice(0, 6);
  let newCards = [];
  selected.forEach(v => {
    const id1 = Math.random().toString(36).substr(2, 9);
    const id2 = Math.random().toString(36).substr(2, 9);
    newCards.push({ id: id1, text: v.present, type: 'present', matchId: id2, audio: v.present });
    newCards.push({ id: id2, text: v.past, type: 'past', matchId: id1, audio: v.past });
  });
  window.memState = { cards: newCards.sort(() => 0.5 - Math.random()), flipped: [], matched: [] };
  renderApp();
};
window.memClick = (id) => {
  let s = window.memState;
  if (s.flipped.length === 2 || s.flipped.includes(id) || s.matched.includes(id)) return;
  
  const card = s.cards.find(c => c.id === id);
  playAudio(card.audio);
  s.flipped.push(id);
  renderApp();

  if (s.flipped.length === 2) {
    const card1 = s.cards.find(c => c.id === s.flipped[0]);
    const card2 = s.cards.find(c => c.id === s.flipped[1]);
    if (card1.matchId === card2.id) {
      setTimeout(() => {
        s.matched.push(card1.id, card2.id);
        s.flipped = [];
        updateProgress(15);
        renderApp();
      }, 1000);
    } else {
      setTimeout(() => { s.flipped = []; renderApp(); }, 1200);
    }
  }
};

function renderMemory() {
  if (window.memState.cards.length === 0) window.initMemory();
  const s = window.memState;
  const isWin = s.cards.length > 0 && s.matched.length === s.cards.length;

  let cardsHTML = s.cards.map(card => {
    const isFlipped = s.flipped.includes(card.id) || s.matched.includes(card.id);
    return `
      <div onclick="memClick('${card.id}')" class="relative w-full h-24 sm:h-32 rounded-xl cursor-pointer transform-style-3d card-transition ${isFlipped ? 'rotate-y-180' : ''}">
        <div class="absolute inset-0 w-full h-full bg-indigo-500 rounded-xl shadow-md flex items-center justify-center backface-hidden ${isFlipped ? 'hidden' : ''}">
          <i data-lucide="gamepad-2" class="w-8 h-8 text-indigo-300 opacity-50"></i>
        </div>
        <div class="absolute inset-0 w-full h-full bg-white border-2 border-indigo-200 rounded-xl shadow-md flex items-center justify-center p-2 text-center backface-hidden ${!isFlipped ? 'hidden' : ''}">

        </div>

  }).join('');

  return `

      ${isWin ? `

    <div class="space-y-6 animate-fade-in max-w-2xl mx-auto">
      <div class="flex items-center justify-between">
        ${getButtonHTML('Menú', "setView('menu')", 'outline', '<i data-lucide="arrow-left" class="w-4 h-4"></i>')}
        <h2 class="text-2xl font-bold text-slate-800">Mi Progreso</h2>
      </div>
      <div class="text-center p-8 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-xl shadow-sm">
        <i data-lucide="trophy" class="w-20 h-20 mx-auto text-yellow-300 mb-4 drop-shadow-md"></i>
        <h3 class="text-3xl font-black mb-2">${progress.points} Puntos Totales</h3>
        <p class="text-indigo-100 text-lg">Nivel Actual: <span class="font-bold">${level}</span></p>
        <div class="mt-8 bg-white/20 rounded-full h-4 overflow-hidden relative">
          <div class="bg-yellow-400 h-full transition-all duration-1000" style="width: ${progressPercent}%"></div>
        </div>
        <p class="text-xs text-indigo-200 mt-2 text-right">${progressPercent}/100 para el próximo nivel</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="p-3 bg-emerald-100 text-emerald-600 rounded-full"><i data-lucide="brain-circuit" class="w-6 h-6"></i></div>
          <div>
            <p class="text-sm text-slate-500 font-bold">Actividades Completadas</p>
            <p class="text-2xl font-black text-slate-800">${Math.floor(progress.points / 15)}</p>
          </div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="p-3 bg-orange-100 text-orange-600 rounded-full"><i data-lucide="book-open" class="w-6 h-6"></i></div>
          <div>
            <p class="text-sm text-slate-500 font-bold">Verbos en la base</p>
            <p class="text-2xl font-black text-slate-800">${verbsData.length}</p>
          </div>
        </div>
      </div>
      <p class="text-center text-slate-400 text-sm mt-8">El progreso se guarda automáticamente en tu navegador.</p>
    </div>
  `;
}

// --- RENDERIZADO PRINCIPAL ---
function renderApp() {
  const appContainer = document.getElementById('app');
  let viewHTML = '';

  switch (currentView) {
    case 'menu': viewHTML = renderMenu(); break;
    case 'learn': viewHTML = renderLearn(); break;
    case 'pronunciation': viewHTML = renderPronunciation(); break;
    case 'sentences': viewHTML = renderSentences(); break;
    case 'fillBlanks': viewHTML = renderFillBlanks(); break;
    case 'classify': viewHTML = renderClassify(); break;
    case 'memory': viewHTML = renderMemory(); break;
    case 'quiz': viewHTML = renderQuiz(); break;
    case 'story': viewHTML = renderStory(); break;
    case 'progress': viewHTML = renderProgress(); break;
    default: viewHTML = renderMenu(); break;
  }

  appContainer.innerHTML = `
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
      <div class="max-w-5xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2 font-bold text-xl cursor-pointer" onclick="setView('menu')">
          <i data-lucide="book-open" class="w-6 h-6"></i>
          <span>VerbMaster English II</span>
        </div>
        <div class="flex items-center gap-2 bg-indigo-800 px-3 py-1 rounded-full text-sm font-medium">
          <i data-lucide="trophy" class="w-4 h-4 text-yellow-400"></i>
          <span id="header-points">${progress.points} pts</span>
        </div>
      </div>
    </header>
    <main class="max-w-5xl mx-auto p-4 sm:p-6 pb-20" id="main-content">
      ${viewHTML}
    </main>
  `;

  // Inicializar iconos de Lucide
  lucide.createIcons();
}

// Inicializar la aplicación al cargar la página
window.onload = renderApp;

</script>
</body>
</html>
