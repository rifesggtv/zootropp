        }

        /* Estilos base del body */
        body {

        /* Estilos de las tarjetas (Card) */
        .card {

            border-radius: 1rem; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); 
        }

        /* Estilos base de los botones (Button) */
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 0.75rem; 
            font-weight: 500; 
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity; 
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); 
            transition-duration: 150ms; 
            font-size: 0.875rem; 
            line-height: 1.25rem; 
            padding-left: 1rem; 
            padding-right: 1rem; 
            padding-top: 0.5rem; 
            padding-bottom: 0.5rem; 
            cursor: pointer;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Variantes de botones */
        .btn-primary { 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        
        .btn-primary:hover:not(:disabled) { 
            background-color: #1e293b; 
        }
        
        .btn-outline { 
            border: 1px solid #e2e8f0; 
            background-color: transparent; 
        }
        
        .btn-outline:hover:not(:disabled) { 
            background-color: #f1f5f9; 
            color: #0f172a; 
        }

        /* Estilos de los inputs (Input y Select) */
        .input { 
            display: flex; 
            height: 2.5rem; 
            width: 100%; 
            border-radius: 0.75rem; 
            border: 1px solid #e2e8f0; 
            background-color: white; 
            padding-left: 0.75rem; 
            padding-right: 0.75rem; 
            padding-top: 0.5rem; 
            padding-bottom: 0.5rem; 
            font-size: 0.875rem; 
            line-height: 1.25rem; 
        }
        
        .input:focus { 
            outline: 2px solid transparent; 
            outline-offset: 2px; 
            box-shadow: 0 0 0 2px #0f172a; 
        }
        
        .input:disabled {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

            padding-bottom: 0.125rem;

        }

// 2. FUNCIONES DE AYUDA (Helpers)

const findVerb = (verbName) => {
    return verbs.find(v => v.base === verbName);
};

const getVerbInfo = (item) => {
    return item.custom || findVerb(item.verb) || { past: item.verb, pronunciation: "", sound: "" };
};

window.speak = (text) => {
    if (typeof window === "undefined" || !window.speechSynthesis) {
        alert("Tu navegador no soporta reproducción de voz.");
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
};

const randomItem = (arr) => {
    return arr[Math.floor(Math.random() * arr.length)];
};

// Modificado ligeramente para manejar apóstrofos con más solidez en las respuestas de repaso
const normalize = (s) => {
    return s.trim().toLowerCase().replace(/[.!?,'’]/g, "");
};

window.getTotalScore = () => {
    let originalScore = gameState.challenges ? gameState.challenges.filter(c => c.result === 'ok').length : 0;
    let proScore = proGameState.challenges ? proGameState.challenges.filter(c => c.result === 'ok').length : 0;
    let tableScore = Object.values(practiceTableResults).filter(res => res === 'ok').length;
    let reviewScore = Object.values(window.reviewResults).filter(res => res === 'ok').length;
    return originalScore + proScore + tableScore + reviewScore;
};

window.saveScore = () => {
    let nameInput = document.getElementById('playerNameInput');
    if(!nameInput || !nameInput.value.trim()) return;
    
    playerName = nameInput.value.trim().substring(0, 15);
    let score = getTotalScore();
    
    leaderBoard.push({name: playerName, score: score});
    leaderBoard.sort((a, b) => b.score - a.score);
    
    let uniqueBoard = [];
    let names = new Set();
    for (let entry of leaderBoard) {
        if (!names.has(entry.name)) {
            uniqueBoard.push(entry);
            names.add(entry.name);
        }
    }
    
    leaderBoard = uniqueBoard.slice(0, 4);
    
    try {
        localStorage.setItem('verbMasterPlayerName', playerName);
        localStorage.setItem('verbMasterLeaderboard', JSON.stringify(leaderBoard));
    } catch(e) {}
    
    renderApp();
};

window.initPracticeTable = () => {
    practiceTableAnswers = {};
    practiceTableResults = {};
    practiceTableRandomMask = verbs.map(() => {
        const cols = ['present', 'past', 'participle', 'es'];
        return cols[Math.floor(Math.random() * cols.length)];
    });

};

window.updatePracticeTableAnswer = (idx, val) => {
    practiceTableAnswers[idx] = val;
    practiceTableResults[idx] = null; 
};

window.checkPracticeTableAnswer = (idx) => {
    let expected = '';
    let v = verbs[idx];
    let col = practiceTableMode === 'random' ? practiceTableRandomMask[idx] : practiceTableMode;
    
    if (col === 'present') expected = v.base;
    else if (col === 'past') expected = v.past;
    else if (col === 'participle') expected = v.participle;
    else if (col === 'es') expected = v.es;

    let normInput = normalize(practiceTableAnswers[idx] || '');
    let expectedParts = expected.split('/').map(s => normalize(s));
    let isCorrect = false;

    if (normInput === normalize(expected)) {
        isCorrect = true;
    } else if (expectedParts.includes(normInput)) {
        isCorrect = true;
    } else if (normInput.replace(/\s+/g, '') === normalize(expected).replace(/\s+/g, '')) {
        isCorrect = true;
    }

    practiceTableResults[idx] = isCorrect ? 'ok' : 'bad';
    renderApp();
};

window.checkAllPracticeTable = () => {
    verbs.forEach((v, idx) => {
        if (practiceTableAnswers[idx] !== undefined && practiceTableAnswers[idx].trim() !== '') {
            checkPracticeTableAnswer(idx);
        }
    });
    renderApp();
};

window.initGames = () => {
    gameState.challenges = [];
    const gameTypes = ['fill', 'class', 'quiz'];
    
    for (let i = 0; i < 50; i++) {
        let type = gameTypes[i % 3]; 
        let challenge = {
            id: i,
            type: type,
            result: null
        };
        
        if (type === 'fill') {
            challenge.item = randomItem(practiceSentences);
            challenge.answer = '';
        } else if (type === 'class') {
            challenge.item = randomItem(verbs);
        } else if (type === 'quiz') {
            let v = randomItem(verbs);
            let wrongOptions = verbs
                .filter(x => x.past !== v.past)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(x => x.past);
            challenge.item = v;
            challenge.options = [...wrongOptions, v.past].sort(() => 0.5 - Math.random());
            challenge.choice = null;
        }
        
        gameState.challenges.push(challenge);
    }
    
    gameState.challenges.sort(() => 0.5 - Math.random());
    gameState.challenges.forEach((ch, index) => ch.id = index);
};

window.updateFill = (id, val) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (ch) ch.answer = val;
};

window.checkFill = (id) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    const info = getVerbInfo(ch.item);
    const correctPast = info.past || ch.item.custom?.past;
    
    if (normalize(ch.answer) === normalize(correctPast)) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

window.pickClass = (id, sound) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    if (sound === ch.item.sound) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

window.pickQuiz = (id, choice) => {
    let ch = gameState.challenges.find(c => c.id === id);
    if (!ch) return;
    ch.choice = choice;
    if (choice === ch.item.past) ch.result = "ok";
    else ch.result = "bad";
    renderApp();
};

window.initProGames = () => {
    proGameState.challenges = [];
    const types = ['sound_match', 'odd_one_out', 'reading', 'syllable', 'listen_guess'];
    const stories = [
        "Yesterday I {past} with my friends all afternoon. (Ayer yo {past} con mis amigos toda la tarde.)",
        "She {past} very early this morning before work. (Ella {past} muy temprano esta mañana antes del trabajo.)",
        "We didn't know what to do, so he {past} to help us a bit. (No sabíamos qué hacer, así que él {past} para ayudarnos un poco.)",
        "Last weekend, my family {past} in the central park. (El fin de semana pasado, mi familia {past} en el parque central.)",
        "When I saw what happened, I was surprised and {past} immediately. (Cuando vi lo que pasó, me sorprendí y {past} inmediatamente.)"
    ];

    for(let i = 0; i < 100; i++) {
        let verb = verbs[i % verbs.length]; 
        let type = types[i % types.length];
        
        let ch = {
            id: i,
            type: type,
            verb: verb,
            result: null,
            choice: null
        };

        if (type === 'sound_match') {
            let isTrue = Math.random() > 0.5;
            let otherSounds = ['/t/', '/d/', '/id/', 'irregular'].filter(s => s !== verb.sound);
            ch.testSound = isTrue ? verb.sound : randomItem(otherSounds);
            ch.isTrue = isTrue;
            ch.correct = isTrue ? 'Verdadero' : 'Falso';
            ch.options = ['Verdadero', 'Falso'];
            
        } else if (type === 'odd_one_out') {
            let soundA = verb.sound;
            let otherSounds = ['/t/', '/d/', '/id/', 'irregular'].filter(s => s !== soundA);
            let soundB = randomItem(otherSounds);
            
            let poolA = verbs.filter(v => v.sound === soundA);
            let poolB = verbs.filter(v => v.sound === soundB);
            
            let v2 = randomItem(poolA);
            if (v2.base === verb.base && poolA.length > 1) {
                v2 = randomItem(poolA.filter(v => v.base !== verb.base));
            }
            let v3 = randomItem(poolB);
            
            ch.options = [verb.base, v2.base, v3.base].sort(() => 0.5 - Math.random());
            ch.correct = v3.base;
            
        } else if (type === 'reading') {
            ch.text = randomItem(stories).replace('{past}', `<b>${verb.past}</b>`);
            ch.options = ['/t/', '/d/', '/id/', 'irregular'];
            ch.correct = verb.sound;
            
        } else if (type === 'syllable') {
            ch.correct = verb.sound === '/id/' ? 'Sí' : 'No';
            ch.options = ['Sí', 'No'];
            
        } else if (type === 'listen_guess') {
            let wrongOptions = verbs
                .filter(v => v.base !== verb.base)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(v => v.base);
            ch.options = [...wrongOptions, verb.base].sort(() => 0.5 - Math.random());
            ch.correct = verb.base;
        }

        proGameState.challenges.push(ch);
    }
    
    proGameState.challenges.sort(() => 0.5 - Math.random());
    proGameState.challenges.forEach((c, idx) => c.id = idx);
};

window.pickProGame = (id, choice) => {
    let ch = proGameState.challenges.find(c => c.id === id);
    if (!ch) return;
    
    ch.choice = choice;
    if (choice === ch.correct) {
        ch.result = 'ok';
    } else {
        ch.result = 'bad';
    }
    renderApp();
};

// Logica Interactiva para Preguntas de Repaso
window.updateReview = (id, val) => {
    window.reviewAnswers[id] = val;
    window.reviewResults[id] = null;
};

window.checkReview = (id, expectedOptionsString) => {
    let inputVal = normalize(window.reviewAnswers[id] || '');
    let options = expectedOptionsString.split('|').map(normalize);
    
    if (inputVal === '') {
        window.reviewResults[id] = null;
    } else if (options.includes(inputVal)) {
        window.reviewResults[id] = 'ok';
    } else {
        window.reviewResults[id] = 'bad';
    }
    renderApp();
};

        if (!alreadySaved) {
            return `
                <div class="mt-3 pt-3 border-t border-slate-600 animate-fade-in">

    let cardsHTML = '';

                    <div class="rounded-xl bg-slate-100 p-2"><b>Sound:</b> ${verb.sound}</div>

                    <option value="all" ${learnFilter === 'all' ? 'selected' : ''}>Todos</option>
                    <option value="regular" ${learnFilter === 'regular' ? 'selected' : ''}>Regulares</option>
                    <option value="irregular" ${learnFilter === 'irregular' ? 'selected' : ''}>Irregulares</option>
                    <option value="/t/" ${learnFilter === '/t/' ? 'selected' : ''}>/t/</option>

                    <option value="/id/" ${learnFilter === '/id/' ? 'selected' : ''}>/id/</option>
                </select>
            </div>
            <div class="mb-3 text-sm text-slate-600">

            </div>
            <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">

            </div>

}

function renderPronunciation() {
    const groups = [
        { sound: "/t/", title: "Sonido /t/", rule: "Se usa cuando el verbo termina en sonido sordo: k, p, sh, ch, f, s, x.", examples: verbs.filter(v => v.sound === "/t/") },
        { sound: "/d/", title: "Sonido /d/", rule: "Se usa cuando el verbo termina en sonido sonoro: vocal, l, n, r, v, z, m, g, y.", examples: verbs.filter(v => v.sound === "/d/") },
        { sound: "/id/", title: "Sonido /id/", rule: "Se usa cuando el verbo termina en sonido /t/ o /d/.", examples: verbs.filter(v => v.sound === "/id/") },
        { sound: "irregular", title: "Irregulares", rule: "No siguen la regla -ed. Hay que aprender pasado y participio por memoria y uso.", examples: verbs.filter(v => v.type === "irregular") }
    ];

    let groupsHTML = '';
    for (let g of groups) {
        let examplesHTML = '';
        for (let v of g.examples) {
            let safeText = v.past.replace(/'/g, "\\'");
            examplesHTML += `<button class="btn btn-outline rounded-full text-xs py-1" onclick="speak('${safeText}')">${v.past} <i data-lucide="volume-2" class="ml-2 h-3 w-3"></i></button>`;
        }
        groupsHTML += `<div class="card p-4 animate-fade-in"><h2 class="text-xl font-bold">${g.title}</h2><p class="mt-1 text-sm text-slate-600">${g.rule}</p><div class="mt-3 flex flex-wrap gap-2">${examplesHTML}</div></div>`;
    }
    return `<div class="grid gap-4 animate-fade-in">${groupsHTML}</div>`;
}

function renderBuilder() {
    const s = builderState;
    const v = findVerb(s.verbName) || verbs[0];
    let sentence = "", explanation = "";
    
    if (s.mode === "affirmative") {
        sentence = `${s.subject} ${v.past} ${s.complement}.`;
        explanation = `Afirmativa en pasado: Subject + verb in past + complement. Usamos "${v.past}" porque la acción ya ocurrió.`;
    } else if (s.mode === "negative") {
        sentence = `${s.subject} did not ${v.base} ${s.complement}.`;
        explanation = `Negativa en pasado: Subject + did not + verb in base form + complement. Después de did not, no se usa el pasado: no es "did not ${v.past}", es "did not ${v.base}".`;
    } else {
        sentence = `Did ${s.subject} ${v.base} ${s.complement}?`;
        explanation = `Pregunta en pasado: Did + subject + verb in base form + complement? Después de Did, el verbo vuelve a base: "${v.base}".`;
    }

    let optionsHTML = verbs.map(verb => `<option value="${verb.base}" ${s.verbName === verb.base ? 'selected' : ''}>${verb.base} → ${verb.past}</option>`).join('');
    let safeSentenceText = sentence.replace(/'/g, "\\'");

    return `
        <div class="card p-5 animate-fade-in">
            <h2 class="mb-3 flex items-center text-xl font-bold"><i data-lucide="pencil-line" class="mr-2 h-5 w-5"></i> Create sentences</h2>
            <div class="grid gap-3 md:grid-cols-4">
                <input class="input" value="${s.subject}" onkeyup="updateBuilder('subject', this.value)" placeholder="Subject" />
                <select class="input" onchange="updateBuilder('verbName', this.value)">${optionsHTML}</select>
                <input class="input" value="${s.complement}" onkeyup="updateBuilder('complement', this.value)" placeholder="Complement" />
                <select class="input" onchange="updateBuilder('mode', this.value)">
                    <option value="affirmative" ${s.mode === 'affirmative' ? 'selected' : ''}>Affirmative</option>
                    <option value="negative" ${s.mode === 'negative' ? 'selected' : ''}>Negative</option>
                    <option value="question" ${s.mode === 'question' ? 'selected' : ''}>Question</option>
                </select>
            </div>
            <div class="mt-5 rounded-2xl bg-slate-100 p-4 text-2xl font-bold">${sentence}</div>
            <div class="mt-3 rounded-2xl border p-4 text-sm text-slate-700"><b>Explanation:</b> ${explanation}<br/><b>Verb:</b> ${v.base} → ${v.past}. <b>Pronunciation:</b> ${v.pronunciation}. <b>Sound:</b> ${v.sound}.</div>
            <button class="btn btn-outline mt-4 rounded-xl" onclick="speak('${safeSentenceText}')"><i data-lucide="volume-2" class="mr-2 h-4 w-4"></i> Listen sentence</button>
        </div>
    `;
}

function renderGrammar() {
    return `
        <div class="grid gap-4 animate-fade-in">
            <div class="card p-5">
                <h2 class="flex items-center text-xl font-bold"><i data-lucide="book-open" class="mr-2 h-5 w-5"></i> How to write sentences in Simple Past</h2>
                <div class="mt-4 grid gap-3 md:grid-cols-3">
                    <div class="rounded-2xl bg-slate-100 p-4"><b>Affirmative</b><p>Subject + verb in past + complement.</p><p class="mt-2 font-semibold">Manolo loved María.</p></div>
                    <div class="rounded-2xl bg-slate-100 p-4"><b>Negative</b><p>Subject + did not + base verb + complement.</p><p class="mt-2 font-semibold">Manolo did not kill the bull.</p></div>
                    <div class="rounded-2xl bg-slate-100 p-4"><b>Question</b><p>Did + subject + base verb + complement?</p><p class="mt-2 font-semibold">Did Manolo save the town?</p></div>
                </div>
            </div>
            <div class="card p-5">
                <h3 class="text-lg font-bold">Important rules</h3>
                <p class="mt-2 text-sm text-slate-700">1. En afirmativa sí usamos el verbo en pasado: <b>Manolo saved the town.</b></p>
                <p class="text-sm text-slate-700">2. En negativa usamos <b>did not</b> y el verbo vuelve a base: <b>did not save</b>, no <b>did not saved</b>.</p>

            </div>
        </div>
    `;
}

function renderFillCard(ch) {

    let statusHTML = '', isOk = ch.result === 'ok', isDisabled = isOk ? 'disabled' : '';
    if (ch.result) {
        let bgClass = isOk ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
        statusHTML = `<div class="mt-4 rounded-2xl p-4 ${bgClass} animate-fade-in"><i data-lucide="${isOk ? 'check-circle-2' : 'x-circle'}" class="inline h-5 w-5"></i> ${isOk ? "Correct!" : `Try again. Correct answer: ${fInfo.past}`}<br/>Pronunciation: <b>${fInfo.pronunciation}</b> | Sound: <b>${fInfo.sound}</b><br/>Spanish: ${ch.item.es}</div>`;
    }
    return `<div class="card p-5"><div class="flex justify-between items-center mb-3"><h2 class="flex items-center text-xl font-bold"><i data-lucide="gamepad-2" class="mr-2 h-5 w-5"></i> Complete the sentence</h2><span class="badge badge-secondary">Game #${ch.id + 1}</span></div><div class="mt-4 rounded-2xl bg-slate-100 p-4 text-xl font-bold">${fBlank}</div><div class="mt-2 text-sm text-slate-500">Present: ${ch.item.present}</div><div class="mt-4 flex gap-2"><input class="input" value="${ch.answer}" onkeyup="updateFill(${ch.id}, this.value); if(event.key === 'Enter') checkFill(${ch.id});" placeholder="Past verb..." ${isDisabled} /><button class="btn btn-primary" onclick="checkFill(${ch.id})" ${isDisabled}>Check</button></div>${statusHTML}<button class="btn btn-outline mt-4 rounded-xl w-full" onclick="speak('${ch.item.past.replace(/'/g, "\\'")}')"><i data-lucide="volume-2" class="mr-2 h-4 w-4"></i> Listen answer</button></div>`;
}

function renderProGames() {

    if (res === 'ok') classes += " border-green-500 text-green-700 bg-green-50";
    else if (res === 'bad') classes += " border-red-500 text-red-700 bg-red-50";
    else classes += " border-slate-400 bg-slate-50 text-slate-800";

            <!-- EXPLICACIONES Y REGLAS (EXPLANATIONS) -->
            <h3 class="text-xl font-bold text-slate-800 flex items-center mt-10 border-b pb-2">
                <i data-lucide="graduation-cap" class="mr-2 text-rose-500"></i> Explicaciones del Pasado Simple
            </h3>
            
            <div class="grid md:grid-cols-2 gap-4">
                
                <div class="card p-5 bg-white">
                    <h4 class="font-bold text-lg text-indigo-900 mb-2">1. Affirmative form</h4>
                    <p class="text-sm text-slate-700 mb-2"><b>Estructura:</b> Sujeto + verbo en pasado + complemento.</p>
                    <div class="bg-slate-100 rounded-lg p-3 text-sm mb-3">
                        <i>I <b>watched</b> a movie yesterday.</i> (Vi una película ayer.)<br/>
                        <i>She <b>cooked</b> dinner last night.</i> (Ella cocinó la cena anoche.)
                    </div>
                    
                    <h5 class="font-bold text-sm mt-4 text-slate-800">Verbos regulares (-ed)</h5>
                    <table class="w-full text-sm text-left mb-4 border-collapse">
                        <tr class="bg-slate-200"><th class="p-1 border">Present</th><th class="p-1 border">Past</th><th class="p-1 border">Español</th></tr>
                        <tr><td class="p-1 border">watch</td><td class="p-1 border font-bold text-rose-600">watched</td><td class="p-1 border">mirar / miró</td></tr>
                        <tr><td class="p-1 border">cook</td><td class="p-1 border font-bold text-rose-600">cooked</td><td class="p-1 border">cocinar / cocinó</td></tr>
                        <tr><td class="p-1 border">play</td><td class="p-1 border font-bold text-rose-600">played</td><td class="p-1 border">jugar / jugó</td></tr>
                        <tr><td class="p-1 border">wait</td><td class="p-1 border font-bold text-rose-600">waited</td><td class="p-1 border">esperar / esperó</td></tr>
                    </table>
                    
                    <h5 class="font-bold text-sm text-slate-800">Reglas de escritura (Spelling rules)</h5>
                    <ul class="text-sm list-disc pl-5 mb-4 text-slate-700">
                        <li>Normal + ed: <b>walk → walked</b></li>
                        <li>Termina en e + d: <b>like → liked</b></li>
                        <li>Consonante + y → ied: <b>copy → copied</b></li>
                        <li>Doblar consonante final: <b>stop → stopped, clap → clapped</b></li>
                    </ul>
                    
                    <h5 class="font-bold text-sm text-slate-800">Verbos irregulares</h5>
                    <p class="text-sm text-slate-600 mb-2">Debes aprender su forma especial en pasado. No usan -ed.</p>
                    <table class="w-full text-sm text-left border-collapse">
                        <tr class="bg-slate-200"><th class="p-1 border">Present</th><th class="p-1 border">Past</th><th class="p-1 border">Español</th></tr>
                        <tr><td class="p-1 border">go</td><td class="p-1 border font-bold text-rose-600">went</td><td class="p-1 border">ir / fue</td></tr>
                        <tr><td class="p-1 border">see</td><td class="p-1 border font-bold text-rose-600">saw</td><td class="p-1 border">ver / vio</td></tr>
                        <tr><td class="p-1 border">sing</td><td class="p-1 border font-bold text-rose-600">sang</td><td class="p-1 border">cantar / cantó</td></tr>
                        <tr><td class="p-1 border">eat</td><td class="p-1 border font-bold text-rose-600">ate</td><td class="p-1 border">comer / comió</td></tr>
                        <tr><td class="p-1 border">read</td><td class="p-1 border font-bold text-rose-600">read</td><td class="p-1 border">leer / leyó (*Se pronuncia "red")</td></tr>
                    </table>
                </div>

                <div class="space-y-4">
                    <div class="card p-5 bg-white">
                        <h4 class="font-bold text-lg text-indigo-900 mb-2">2. Negative form</h4>
                        <p class="text-sm text-slate-700 mb-2"><b>Estructura:</b> Sujeto + <b>did not (didn't)</b> + verbo base + complemento.</p>
                        <div class="bg-rose-50 rounded-lg p-3 text-sm border border-rose-100">
                            <b>Importante:</b> Después de did not / didn't, el verbo va en forma base. <br/><br/>
                            <i data-lucide="check" class="inline w-4 h-4 text-green-600"></i> Correcto: <i>She <b>didn't go</b>.</i><br/>
                            <i data-lucide="x" class="inline w-4 h-4 text-red-600"></i> Incorrecto: <i>She didn't went.</i><br/><br/>
                            <i data-lucide="check" class="inline w-4 h-4 text-green-600"></i> Correcto: <i>Manolo <b>did not kill</b> the bull.</i><br/>
                            <i data-lucide="x" class="inline w-4 h-4 text-red-600"></i> Incorrecto: <i>Manolo did not killed the bull.</i>
                        </div>
                    </div>

                    <div class="card p-5 bg-white">
                        <h4 class="font-bold text-lg text-indigo-900 mb-2">3. Interrogative form</h4>
                        <p class="text-sm text-slate-700 mb-2"><b>Estructura:</b> <b>Did</b> + sujeto + verbo base + complemento?</p>
                        <div class="bg-rose-50 rounded-lg p-3 text-sm border border-rose-100">
                            <b>Muy importante:</b> Porque "did" ya marca el pasado, el verbo vuelve a su forma base.<br/><br/>
                            <i data-lucide="check" class="inline w-4 h-4 text-green-600"></i> Correcto: <i><b>Did</b> you <b>see</b> him?</i><br/>
                            <i data-lucide="x" class="inline w-4 h-4 text-red-600"></i> Incorrecto: <i>Did you saw him?</i><br/><br/>
                            <b>Respuestas cortas:</b><br/>
                            Yes, I did. / No, I didn’t.<br/>
                            Yes, she did. / No, she didn’t.
                        </div>
                    </div>
                    
                    <div class="card p-5 bg-white">
                        <h4 class="font-bold text-lg text-indigo-900 mb-2">4. Simple past con "To Be" (was/were)</h4>
                        <p class="text-sm text-slate-700 mb-2">Con el verbo <i>to be</i>, <b>NO</b> uses did ni didn't. Solo agrega <i>not</i>.</p>
                        <ul class="text-sm list-disc pl-5 text-slate-700 space-y-1">
                            <li><b>Usa was:</b> I, he, she, it. <i>(I was tired / I was not tired / Was I tired?)</i></li>
                            <li><b>Usa were:</b> you, we, they. <i>(They were happy / They were not happy / Were they happy?)</i></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- TEXTOS CORTOS DE EJEMPLO -->
            <h3 class="text-xl font-bold text-slate-800 flex items-center mt-10 border-b pb-2">
                <i data-lucide="file-text" class="mr-2 text-rose-500"></i> Textos cortos de ejemplo
            </h3>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="card p-4 bg-slate-50 border-l-4 border-emerald-500">
                    <h5 class="font-bold text-emerald-800 mb-2">Text 1: Affirmative</h5>
                    <p class="italic text-sm text-slate-800">Yesterday, I visited my grandmother. I helped her in the kitchen and cleaned the table. Then, we watched a movie together. It was a beautiful afternoon.</p>
                    <p class="text-xs text-slate-500 mt-2">Ayer visité a mi abuela. La ayudé en la cocina y limpié la mesa. Luego vimos una película juntos. Fue una tarde bonita.</p>
                </div>
                <div class="card p-4 bg-slate-50 border-l-4 border-red-500">
                    <h5 class="font-bold text-red-800 mb-2">Text 2: Negative</h5>
                    <p class="italic text-sm text-slate-800">Yesterday, I didn’t go to the park. I didn’t play soccer because it rained a lot. I stayed at home and studied English.</p>
                    <p class="text-xs text-slate-500 mt-2">Ayer no fui al parque. No jugué fútbol porque llovió mucho. Me quedé en casa y estudié inglés.</p>
                </div>
                <div class="card p-4 bg-slate-50 border-l-4 border-amber-500">
                    <h5 class="font-bold text-amber-800 mb-2">Text 3: Questions</h5>
                    <p class="italic text-sm text-slate-800">Did you watch a movie last night? Did you like it? Did you eat popcorn? I watched a movie, but I didn’t eat popcorn.</p>
                    <p class="text-xs text-slate-500 mt-2">¿Viste una película anoche? ¿Te gustó? ¿Comiste palomitas? Yo vi una película, pero no comí palomitas.</p>
                </div>
                <div class="card p-4 bg-slate-50 border-l-4 border-blue-500">
                    <h5 class="font-bold text-blue-800 mb-2">Text 4: Mixed forms</h5>
                    <p class="italic text-sm text-slate-800">Last Saturday, I went to the cinema with my friends. We watched a comedy movie. I liked the movie, but I didn’t like the ending. Did my friends like it? Yes, they did.</p>
                    <p class="text-xs text-slate-500 mt-2">El sábado pasado fui al cine con mis amigos. Vimos una película de comedia. Me gustó la película, pero no me gustó el final. ¿A mis amigos les gustó? Sí.</p>
                </div>
            </div>

        </div>
    `;
}

// ==========================================
// 6. MOTOR PRINCIPAL DE RENDERIZADO
// ==========================================

function renderApp() {
    const appContainer = document.getElementById('app');
    
    let activeContent = '';
    
    if (activeTab === 'learn') activeContent = renderLearn();
    else if (activeTab === 'pronunciation') activeContent = renderPronunciation();
    else if (activeTab === 'builder') activeContent = renderBuilder();
    else if (activeTab === 'grammar') activeContent = renderGrammar();
    else if (activeTab === 'sentences') activeContent = renderLibrary();
    else if (activeTab === 'movie') activeContent = renderMovieMode();
    else if (activeTab === 'games') activeContent = renderGames();
    else if (activeTab === 'pro-games') activeContent = renderProGames();
    else if (activeTab === 'practice-table') activeContent = renderPracticeTable();
    else if (activeTab === 'review') activeContent = renderReviewQuestions();

    appContainer.innerHTML = `
        <div class="min-h-screen bg-slate-50 p-4 text-slate-900 md:p-8 pb-20">
            <div class="mx-auto max-w-7xl">
                ${renderHeader()}
                ${renderTabs()}
                ${activeContent}
            </div>
        </div>
    `;

    lucide.createIcons();
}

window.onload = () => {
    renderApp();
};

</script>
